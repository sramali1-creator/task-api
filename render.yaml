services:
  - type: web
    name: task-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run migrate:deploy && npm run seed:prod
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-api-db
          property: connectionString
databases:
  - name: task-api-db
    plan: free
